<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#1a1f3e"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0070f3"/>
      <stop offset="100%" style="stop-color:#00a8ff"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#26a17b"/>
      <stop offset="100%" style="stop-color:#50af95"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#0070f3" opacity="0.08"/>
  <circle cx="1100" cy="530" r="250" fill="#50af95" opacity="0.06"/>

  <!-- PayPal Logo Area -->
  <rect x="180" y="200" width="280" height="180" rx="20" fill="#003087" opacity="0.9"/>
  <text x="320" y="280" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">PayPal</text>
  <text x="320" y="330" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">USD</text>

  <!-- Arrow -->
  <g filter="url(#glow)">
    <path d="M500 290 L560 290 L560 260 L620 295 L560 330 L560 300 L500 300 Z" fill="url(#blueGlow)"/>
  </g>

  <!-- USDT Logo Area -->
  <rect x="660" y="200" width="280" height="180" rx="20" fill="#26a17b" opacity="0.9"/>
  <text x="800" y="280" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">Tether</text>
  <text x="800" y="330" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">USDT</text>

  <!-- Main Title -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white" text-anchor="middle">PayPal USD to USDT</text>

  <!-- Subtitle -->
  <text x="600" y="540" font-family="Arial, sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle">Fast Exchange | No KYC | 11-13% Fee</text>

  <!-- Top badge -->
  <rect x="440" y="80" width="320" height="50" rx="25" fill="url(#blueGlow)" opacity="0.2"/>
  <rect x="440" y="80" width="320" height="50" rx="25" fill="none" stroke="url(#blueGlow)" stroke-width="2"/>
  <text x="600" y="115" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#0070f3" text-anchor="middle">3000+ Transactions Since 2022</text>

  <!-- Bottom info -->
  <text x="600" y="600" font-family="Arial, sans-serif" font-size="20" fill="#64748b" text-anchor="middle">pp.daniilink.com</text>
</svg>

version: '3.8'

# ═══════════════════════════════════════════════════════════════
# PP Exchange - Production Docker Compose
# ═══════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────
  # Main Backend API
  # ─────────────────────────────────────────────────────────────
  pp-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pp-backend
    restart: always
    ports:
      - "127.0.0.1:3000:3000"  # Only localhost - nginx will proxy
    environment:
      - NODE_ENV=production
      - TZ=Europe/Kyiv
    env_file:
      - .env
    networks:
      - pp-network
    depends_on:
      screenshot-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M

  # ─────────────────────────────────────────────────────────────
  # Screenshot Service (Puppeteer)
  # ─────────────────────────────────────────────────────────────
  screenshot-service:
    image: ghcr.io/nickvdyck/puppeteer-server:latest
    container_name: screenshot-service
    restart: always
    # No external port exposure - only internal network
    environment:
      - TZ=Europe/Kyiv
    networks:
      - pp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'
        reservations:
          memory: 256M
    # Security: run as non-root
    security_opt:
      - no-new-privileges:true

  # ─────────────────────────────────────────────────────────────
  # Static Website (Optional - can use host nginx instead)
  # ─────────────────────────────────────────────────────────────
  pp-website:
    image: nginx:alpine
    container_name: pp-website
    restart: always
    ports:
      - "127.0.0.1:8080:80"  # Only localhost
    volumes:
      - ./website:/usr/share/nginx/html:ro
      - ./nginx/website-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  # ─────────────────────────────────────────────────────────────
  # Watchtower - Auto-update containers (optional)
  # ─────────────────────────────────────────────────────────────
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=86400  # Check daily
      - WATCHTOWER_INCLUDE_STOPPED=false
      - TZ=Europe/Kyiv
    # Only update screenshot-service (external image)
    command: screenshot-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

networks:
  pp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# Named volumes for persistence (if needed in future)
volumes:
  pp-logs:
    driver: local

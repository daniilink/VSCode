# ═══════════════════════════════════════════════════════════════
# PP Exchange - Nginx Configuration (Behind Cloudflare)
# Cloudflare handles SSL termination, nginx only needs HTTP
# ═══════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────
# Rate Limiting Zones
# ─────────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=form_submit:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=screenshot:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Upstream backend
upstream pp_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ─────────────────────────────────────────────────────────────
# Main Website: pp.daniilink.com
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name pp.daniilink.com;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root
    root /var/www/pp-exchange/website;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss;

    # Connection Limits
    limit_conn addr 20;

    # Static Files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        limit_req zone=api_general burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    error_page 404 /index.html;
}

# ─────────────────────────────────────────────────────────────
# API Backend: api.daniilink.com
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.daniilink.com;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Connection limits
    limit_conn addr 30;

    # Health Check (no rate limit)
    location = /health {
        proxy_pass http://pp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # PP Exchange Form Submit
    location = /webhook/pp-exchange {
        limit_req zone=form_submit burst=5 nodelay;

        proxy_pass http://pp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        add_header Access-Control-Allow-Origin "https://pp.daniilink.com" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        client_max_body_size 10K;
    }

    # PayPal IPN
    location = /webhook/ipn-paypal {
        limit_req zone=webhook_limit burst=50 nodelay;

        proxy_pass http://pp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 30s;
        client_max_body_size 64K;
    }

    # Sync Endpoints
    location ~ ^/webhook/(UpdateClients|paypals-to-db)$ {
        limit_req zone=api_general burst=5 nodelay;

        proxy_pass http://pp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        client_max_body_size 1M;
    }

    # Screenshot Endpoints (viewer pages)
    location ~ ^/webhook/(txnscreen|email-screenshot|email-viewer)$ {
        limit_req zone=screenshot burst=3 nodelay;

        proxy_pass http://pp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Screenshot API (for viewer buttons)
    location = /webhook/get-viewer-screenshot {
        limit_req zone=screenshot burst=3 nodelay;

        proxy_pass http://pp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;

        add_header Access-Control-Allow-Origin "*" always;
    }

    # Admin Dashboard
    location /admin {
        limit_req zone=api_general burst=10 nodelay;

        proxy_pass http://pp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Block everything else
    location / {
        return 404 '{"error": "Not found"}';
        add_header Content-Type application/json;
    }

    # Logging
    access_log /var/log/nginx/api.daniilink.com.access.log;
    error_log /var/log/nginx/api.daniilink.com.error.log warn;
}

# ─────────────────────────────────────────────────────────────
# n8n legacy redirect
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name n8n.daniilink.com;

    location /webhook/ {
        return 301 https://api.daniilink.com$request_uri;
    }

    location / {
        return 410;
    }
}

# ═══════════════════════════════════════════════════════════════
# Nginx Configuration for PP Exchange
# Place this in /etc/nginx/sites-available/pp-exchange
# ═══════════════════════════════════════════════════════════════

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/s;

# ───────────────────────────────────────────────────────────────
# Main website: pp.daniilink.com
# ───────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name pp.daniilink.com;
    
    # Redirect to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pp.daniilink.com;
    
    # SSL certificates (Certbot will manage these)
    ssl_certificate /etc/letsencrypt/live/pp.daniilink.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pp.daniilink.com/privkey.pem;
    
    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Root directory for static website
    root /var/www/pp-exchange/website;
    index index.html;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
    
    # Static files with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Main page
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ───────────────────────────────────────────────────────────────
# API backend: api.daniilink.com
# ───────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.daniilink.com;
    
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.daniilink.com;
    
    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/api.daniilink.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.daniilink.com/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Webhooks - higher rate limit
    location /webhook/ {
        limit_req zone=webhook_limit burst=50 nodelay;
        
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Longer timeout for screenshots
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        
        # For PayPal IPN - allow large bodies
        client_max_body_size 10M;
    }
    
    # Health check
    location /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
    }
    
    # Block everything else
    location / {
        return 404;
    }
}

# ───────────────────────────────────────────────────────────────
# Legacy n8n domain redirect (optional)
# ───────────────────────────────────────────────────────────────
server {
    listen 80;
    listen 443 ssl http2;
    server_name n8n.daniilink.com;
    
    ssl_certificate /etc/letsencrypt/live/n8n.daniilink.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.daniilink.com/privkey.pem;
    
    # Redirect all webhook requests to new API domain
    location /webhook/ {
        return 301 https://api.daniilink.com$request_uri;
    }
    
    location / {
        return 410; # Gone - n8n is deprecated
    }
}

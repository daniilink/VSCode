# ═══════════════════════════════════════════════════════════════
# PP Exchange - Production Nginx Configuration
# /etc/nginx/sites-available/pp-exchange.conf
# ═══════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────
# Rate Limiting Zones
# ─────────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=form_submit:10m rate=2r/m;  # 2 per minute for form
limit_req_zone $binary_remote_addr zone=screenshot:10m rate=5r/m;   # Screenshots are heavy
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Upstream backend
upstream pp_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Upstream website container (optional)
upstream pp_website {
    server 127.0.0.1:8080;
    keepalive 16;
}

# ─────────────────────────────────────────────────────────────
# Main Website: pp.daniilink.com
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name pp.daniilink.com;

    # ACME challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pp.daniilink.com;

    # ── SSL Configuration ──
    ssl_certificate /etc/letsencrypt/live/pp.daniilink.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pp.daniilink.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (2 years)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP - adjust as needed
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.hcaptcha.com https://newassets.hcaptcha.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://newassets.hcaptcha.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://hcaptcha.com https://newassets.hcaptcha.com; connect-src 'self' https://api.daniilink.com https://hcaptcha.com;" always;

    # ── Root and Compression ──
    root /var/www/pp-exchange/website;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 1000;

    # ── Connection Limits ──
    limit_conn addr 20;

    # ── Static Files with Caching ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Main Page ──
    location / {
        limit_req zone=api_general burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # ── Block sensitive files ──
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* (\.env|\.git|composer\.json|package\.json|package-lock\.json) {
        deny all;
        return 404;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
}

# ─────────────────────────────────────────────────────────────
# API Backend: api.daniilink.com
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.daniilink.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.daniilink.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/api.daniilink.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.daniilink.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Connection limits
    limit_conn addr 30;

    # ── Health Check (no rate limit) ──
    location = /health {
        proxy_pass http://pp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # ── PP Exchange Form Submit ──
    location = /webhook/pp-exchange {
        limit_req zone=form_submit burst=5 nodelay;

        proxy_pass http://pp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # CORS for form
        add_header Access-Control-Allow-Origin "https://pp.daniilink.com" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        client_max_body_size 10K;
    }

    # ── PayPal IPN (from PayPal servers) ──
    location = /webhook/ipn-paypal {
        limit_req zone=webhook_limit burst=50 nodelay;

        proxy_pass http://pp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 30s;
        client_max_body_size 64K;
    }

    # ── Sync Endpoints (from Apps Script triggers) ──
    location ~ ^/webhook/(UpdateClients|paypals-to-db)$ {
        limit_req zone=api_general burst=5 nodelay;

        proxy_pass http://pp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        client_max_body_size 1M;  # Bigger for sheet sync
    }

    # ── Screenshot Endpoints ──
    location ~ ^/webhook/(txnscreen|email-screenshot|email-viewer)$ {
        limit_req zone=screenshot burst=3 nodelay;

        proxy_pass http://pp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Screenshots take time
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Screenshot Backend (viewer screenshot API) ──
    location = /webhook/get-viewer-screenshot {
        limit_req zone=screenshot burst=3 nodelay;

        proxy_pass http://pp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;

        # CORS for frontend
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ── Admin Dashboard ──
    location /admin {
        limit_req zone=api_general burst=10 nodelay;

        proxy_pass http://pp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ── Block everything else ──
    location / {
        return 404 '{"error": "Not found"}';
        add_header Content-Type application/json;
    }

    # Logging
    access_log /var/log/nginx/api.daniilink.com.access.log;
    error_log /var/log/nginx/api.daniilink.com.error.log warn;
}

# ─────────────────────────────────────────────────────────────
# Legacy n8n redirect (if you had n8n before)
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen 443 ssl http2;
    server_name n8n.daniilink.com;

    ssl_certificate /etc/letsencrypt/live/n8n.daniilink.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.daniilink.com/privkey.pem;

    # Redirect webhooks to new API
    location /webhook/ {
        return 301 https://api.daniilink.com$request_uri;
    }

    location / {
        return 410;  # Gone
    }
}

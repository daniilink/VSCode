# ═══════════════════════════════════════════════════════════════
# PP Exchange - Docker Compose
# ═══════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────
  # Main Backend API
  # ─────────────────────────────────────────────────────────────
  pp-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pp-backend
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - TZ=Europe/Kyiv
    env_file:
      - .env
    volumes:
      - pp-data:/app/data
    networks:
      - pp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─────────────────────────────────────────────────────────────
  # Screenshot Service (Puppeteer)
  # ─────────────────────────────────────────────────────────────
  screenshot-service:
    build:
      context: ./screenshot
      dockerfile: Dockerfile
    container_name: screenshot-service
    restart: always
    environment:
      - TZ=Europe/Kyiv
    networks:
      - pp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

networks:
  pp-network:
    driver: bridge

volumes:
  pp-data:
    driver: local
